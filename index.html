<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brandbook OS 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BRANDBOOK OS 101 — widget embebible · identidad LaGutierrez
   Todo el CSS está bajo .bmk para no chocar con tu web.
   Paleta: Rojo Pasión #8C2936 · Blanco Fantasmal #FFFFFF ·
           Sombra Oscura #000000 · Beige Costero #F9EED9
   ============================================================ */
.bmk{
  --rojo:#8C2936; --blanco:#FFFFFF; --sombra:#000000; --beige:#F9EED9;
  --bg:var(--beige); --surface:var(--blanco); --ink:#231F20; --muted:#76625E;
  --line:#EAD5C6; --line-strong:#D8B3AA;
  --accent:var(--rojo); --accent-soft:#F3DCD8;
  --radius:4px;
  --serif:'Libre Caslon Text', Georgia, 'Times New Roman', serif;
  --tabs-dur:250ms; --tabs-ease:cubic-bezier(0.22, 1, 0.36, 1);
  --stagger-dur:500ms; --stagger-distance:12px; --stagger-stagger:40ms; --stagger-blur:3px; --stagger-ease:cubic-bezier(0.22, 1, 0.36, 1);
  background:var(--bg); color:var(--ink); font-family:var(--serif);
  font-size:15px; line-height:1.6; padding:56px 20px 72px;
  -webkit-font-smoothing:antialiased;
}
.bmk *,.bmk *::before,.bmk *::after{box-sizing:border-box}
.bmk button,.bmk input,.bmk textarea{font-family:var(--serif)}
.bmk button{font-size:inherit;color:inherit;cursor:pointer}
.bmk h1,.bmk h2,.bmk h3,.bmk h4,.bmk p{margin:0}
.bmk em{font-style:italic}
.bmk-wrap{max-width:1080px;margin:0 auto}
.bmk-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}

/* ---------- Buttons ---------- */
.bmk-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rojo);background:var(--rojo);color:var(--blanco)!important;
  padding:12px 22px;border-radius:999px;font-size:14px;letter-spacing:.02em;transition:background .2s,border-color .2s}
.bmk-btn:hover{background:var(--sombra);border-color:var(--sombra)}
.bmk-btn--ghost{background:transparent;color:var(--ink)!important;border-color:var(--line-strong)}
.bmk-btn--ghost:hover{background:var(--surface);border-color:var(--rojo);color:var(--rojo)!important}
.bmk-link{background:none;border:0;padding:6px 0;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.bmk-link:hover{color:var(--rojo)}

/* ---------- Progress bar ---------- */
.bmk-bar{height:3px;background:var(--line);overflow:hidden}
.bmk-bar > i{display:block;height:100%;background:var(--sombra);transition:width .35s ease}
.bmk-bar.is-done > i{background:var(--rojo)}

/* ---------- MAP: hero ---------- */
.bmk-hero{display:grid;grid-template-columns:1fr 250px;gap:40px;align-items:end;padding-bottom:8px}
.bmk-hero h1{font-weight:400;font-size:clamp(36px,5.4vw,60px);line-height:1.02;letter-spacing:-.015em;margin:0;color:var(--sombra);width:fit-content;max-width:100%}
.bmk-hero h1 em{display:block;text-align:right;color:var(--rojo);font-size:.82em;margin-top:.08em}
.bmk-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.bmk-panel-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bmk-pct{font-size:24px;line-height:1;color:var(--rojo)}
.bmk-panel .bmk-btn{width:100%;justify-content:center;margin-top:14px;padding:9px 14px;font-size:13px}

/* ---------- MAP: rail ---------- */
.bmk-rail{display:grid;grid-template-columns:repeat(7,1fr);margin:80px 0 0}
.bmk-rail-step{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;padding:0}
.bmk-rail-step:not(:last-child)::after{content:'';position:absolute;top:17px;left:calc(50% + 22px);right:calc(-50% + 22px);height:1px;background:var(--line-strong)}
.bmk-rail-step.is-done:not(:last-child)::after{background:var(--rojo)}
.bmk-node{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:12px;color:var(--muted);transition:all .2s}
.bmk-rail-step.is-done .bmk-node{background:var(--rojo);border-color:var(--rojo);color:var(--blanco)}
.bmk-rail-step.is-partial .bmk-node{border-color:var(--sombra);color:var(--sombra)}
.bmk-rail-step.is-next .bmk-node{border-color:var(--rojo);color:var(--rojo);box-shadow:0 0 0 5px var(--accent-soft)}
.bmk-rail-step.is-final .bmk-node{background:var(--sombra);border-color:var(--sombra);color:var(--beige)}
.bmk-rail-label{font-size:13px;color:var(--muted);text-align:center;line-height:1.3;padding:0 4px}
.bmk-rail-step:hover .bmk-rail-label{color:var(--rojo)}

/* ---------- MAP: filas bajo la línea de tiempo / rows under the timeline ---------- */
/* Filas editoriales: etiqueta en cursiva a la izquierda, contenido a la derecha */
.bmk-how,.bmk-use{max-width:820px;margin:80px auto 0;display:grid;gap:30px}
.bmk-use{margin-top:56px}
.bmk-row{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:baseline}
.bmk-row > em{font-size:19px;color:var(--rojo);text-align:right}
.bmk-row p{font-size:clamp(18px,2.2vw,22px);line-height:1.2;color:var(--sombra)}
.bmk-row p small{display:block;font-size:14px;line-height:1.5;color:var(--muted);margin-top:6px}

/* ---------- Stepper — Transitions.dev "Tabs sliding" ---------- */
.bmk-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--rojo)}
.bmk-steps,.bmk-lang{position:relative;display:inline-flex;align-items:center;gap:3px;padding:3px;border-radius:48px;background:#F0DDC4;max-width:100%;overflow-x:auto;scrollbar-width:none}
.bmk-steps::-webkit-scrollbar{display:none}
.bmk-steps-pill,.bmk-lang-pill{position:absolute;top:3px;left:0;height:30px;width:0;background:var(--blanco);border-radius:48px;
  box-shadow:0 1px 2px rgba(140,41,54,.14),0 2px 6px -2px rgba(140,41,54,.14);
  transform:translateX(0);transition:transform var(--tabs-dur) var(--tabs-ease),width var(--tabs-dur) var(--tabs-ease);
  will-change:transform,width;z-index:0;pointer-events:none}
.bmk-pill{position:relative;z-index:1;flex:none;appearance:none;border:0;background:transparent;height:30px;min-width:40px;padding:4px 12px;
  border-radius:48px;font-size:13px;color:rgba(35,31,32,.7);white-space:nowrap;transition:color var(--tabs-dur) var(--tabs-ease)}
.bmk-pill:not([aria-selected="true"]):hover,.bmk-pill[aria-selected="true"]{color:var(--sombra)}
.bmk-pill.is-done{color:var(--rojo)}
.bmk-util{display:flex;justify-content:flex-end;margin:-32px 0 16px}
.bmk-saved{font-size:13px;font-style:italic;color:var(--muted);transition:color .3s}
.bmk-saved.flash{color:var(--rojo)}
@media (prefers-reduced-motion:reduce){.bmk-steps-pill,.bmk-lang-pill,.bmk-pill{transition:none!important}}

/* ---------- SECTION ---------- */
.bmk-layout{display:grid;grid-template-columns:270px 1fr;gap:48px;margin-top:40px;align-items:start}
.bmk-aside{position:sticky;top:24px}
.bmk-sec-num{font-size:88px;line-height:.9;color:var(--rojo);letter-spacing:-.03em}
.bmk-aside h2{font-weight:400;font-size:clamp(34px,4vw,44px);line-height:1.02;letter-spacing:-.015em;margin:22px 0 8px;color:var(--sombra)}
.bmk-aside .bmk-desc{color:var(--muted);margin:0 0 28px;font-size:16px;font-style:italic;line-height:1.3}
.bmk-aside-prog{font-size:13px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.bmk-aside-prog em{color:var(--ink)}
.bmk-tip{margin-top:32px;padding-top:16px;border-top:1px solid var(--rojo);color:var(--rojo);font-size:17px;font-style:italic;line-height:1.35}
.bmk-tip em{font-style:normal}
.bmk-tip b{display:block;font-size:10.5px;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

.bmk-form{border-bottom:1px solid var(--line)}
.bmk-field{display:grid;grid-template-columns:190px 1fr;gap:10px 36px;padding:28px 0;border-top:1px solid var(--line)}
.bmk-field:first-child{padding-top:6px;border-top:0}
.bmk-field-head{display:flex;align-items:flex-start;gap:10px}
.bmk-check{width:16px;height:16px;margin-top:5px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;flex:none;font-size:9px;color:transparent;transition:all .2s;font-family:system-ui,sans-serif}
.bmk-field.is-done .bmk-check{background:var(--rojo);border-color:var(--rojo);color:var(--blanco)}
.bmk-label{font-size:19px;font-style:italic;line-height:1.25;color:var(--sombra)}
.bmk-field.is-done .bmk-label{color:var(--rojo)}
.bmk .bmk-hint{color:var(--muted);font-size:14px;margin:2px 0 12px}
.bmk .bmk-hint em{color:var(--ink)}
.bmk-input{width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);padding:11px 13px;font-size:15px;color:var(--ink);background:var(--blanco);transition:border-color .15s,box-shadow .15s}
.bmk-input:focus{outline:none;border-color:var(--rojo);box-shadow:0 0 0 3px rgba(140,41,54,.1)}
textarea.bmk-input{resize:vertical;min-height:48px;line-height:1.55}
.bmk-list{display:grid;gap:8px}
.bmk-list-row{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px}
.bmk-list-n{color:var(--rojo);font-size:15px;text-align:center;font-style:italic}
.bmk-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:6px}
.bmk-x:hover{color:var(--rojo)}
.bmk-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:var(--radius);padding:7px;background:var(--blanco);min-height:46px}
.bmk-tags:focus-within{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(140,41,54,.1)}
.bmk-tag{display:inline-flex;align-items:center;gap:2px;background:var(--beige);border-radius:999px;padding:3px 4px 3px 12px;font-size:14px;font-style:italic}
.bmk-tag .bmk-x{font-size:15px;padding:2px 6px;font-style:normal}
.bmk-tag-input{flex:1;min-width:140px;border:0;outline:none;font-size:15px;padding:4px 6px;background:transparent;color:var(--ink)}
.bmk-count{font-size:12px;color:var(--muted);margin-top:6px;font-style:italic}
.bmk-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.bmk-pair span{font-size:26px;color:var(--rojo);line-height:1;font-style:italic}
.bmk-input::placeholder{color:#B9A49E}
.bmk-fixed{background:var(--beige);border-radius:var(--radius);padding:14px 16px;font-size:14px}
.bmk-fixed ol{margin:0;padding-left:20px}
.bmk-fixed li{padding:2px 0}
.bmk-fixed li::marker{color:var(--rojo)}
.bmk-field--fixed .bmk-check{background:var(--line-strong);border-color:var(--line-strong);color:var(--blanco)}

.bmk-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}

/* ---------- RESULT ---------- */
.bmk-result-head{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end;margin:40px 0 28px}
.bmk-result-head h2{font-weight:400;font-size:clamp(34px,4.8vw,52px);line-height:1.02;letter-spacing:-.015em;margin:12px 0 10px;color:var(--sombra)}
.bmk-result-head h2 em{color:var(--rojo)}
.bmk-result-head p{color:var(--muted);font-style:italic;font-size:16px;line-height:1.35}
.bmk-result-head p em{font-style:normal}
.bmk-result-head p em{color:var(--ink)}
.bmk-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bmk-missing{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--rojo);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px}
.bmk-missing h4{margin:0 0 10px;font-size:15px;font-weight:700}
.bmk-missing ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bmk-missing li{display:flex;gap:10px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.bmk-missing li button{background:none;border:0;padding:0;color:var(--rojo);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.bmk-missing li span{color:var(--muted);font-style:italic}
.bmk-complete{background:var(--rojo);color:var(--blanco);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;font-size:15px}
.bmk-pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:32px;font-family:var(--serif);font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:560px;overflow:auto;color:var(--ink)}
.bmk-use{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:36px}

.bmk-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#000;color:#fff;padding:10px 20px;border-radius:999px;font-family:'Libre Caslon Text',Georgia,serif;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
.bmk-toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
/* ---------- Transitions.dev — Texts reveal ---------- */
/* Cambio de vista: cada .bmk-line entra escalonada (--i) al añadir .is-shown al stage;
   al salir, .is-hiding hace un fundido corto de 200ms sin repetir el escalonado. */
.bmk-line{opacity:0;transform:translateY(var(--stagger-distance));filter:blur(var(--stagger-blur));
  transition:opacity var(--stagger-dur) var(--stagger-ease),transform var(--stagger-dur) var(--stagger-ease),filter var(--stagger-dur) var(--stagger-ease);
  transition-delay:calc(var(--stagger-stagger) * var(--i, 0))}
.bmk-stage.is-shown .bmk-line{opacity:1;transform:none;filter:none}
.bmk-stage.is-hiding .bmk-line,.bmk-stage.is-hiding.hide-all .bmk-top{opacity:0;transform:none;filter:none;
  transition:opacity 200ms ease,transform 0s linear,filter 0s linear;transition-delay:0s}
/* Actualizaciones al rellenar (check, etiqueta, contador, etiquetas nuevas…) */
@keyframes bmk-reveal{from{opacity:0;transform:translateY(var(--stagger-distance));filter:blur(var(--stagger-blur))}to{opacity:1;transform:none;filter:none}}
.bmk-upd{animation:bmk-reveal var(--stagger-dur) var(--stagger-ease) both;animation-delay:calc(var(--stagger-stagger) * var(--j, 0))}
@media (prefers-reduced-motion:reduce){.bmk-line{transition:none!important}.bmk-upd{animation:none!important}}

@media (max-width:860px){
  .bmk-hero,.bmk-result-head{grid-template-columns:1fr;gap:24px}
  .bmk-layout{grid-template-columns:1fr;gap:24px}
  .bmk-aside{position:static}
  .bmk-sec-num{font-size:60px}
  .bmk-field{grid-template-columns:1fr;gap:8px}
}
@media (max-width:640px){
  .bmk{padding:36px 16px 52px}
  .bmk-rail{margin:40px 0 20px}
  .bmk-util{margin:-20px 0 12px}
  .bmk-rail-label{display:none}
  .bmk-node{width:30px;height:30px;font-size:11px}
  .bmk-rail-step:not(:last-child)::after{top:14px;left:calc(50% + 18px);right:calc(-50% + 18px)}
  .bmk-row{grid-template-columns:1fr;gap:4px}
  .bmk-row > em{text-align:left}
  .bmk-how{margin-top:56px}
  .bmk-pair{grid-template-columns:1fr}
  .bmk-pair span{text-align:center}
  .bmk-nav .bmk-btn{flex:1;justify-content:center}
}
</style>
</head>
<body>

<div class="bmk" id="bmk" aria-live="polite"></div>
<div class="bmk-toast" id="bmk-toast"></div>

<script>
(function () {
  /* ============================================================
     CONTENIDO / CONTENT — textos en español (es) e inglés (en).
     Escribe *palabra* para mostrarla en cursiva.
     Tipos de campo: text · textarea · list · tags · pair · fixed
     ============================================================ */
  const BASE = [
    { time: 5, fields: [
      { id: 'brand', type: 'textarea', rows: 2 },
      { id: 'idea', type: 'textarea', rows: 2 },
      { id: 'promise', type: 'textarea', rows: 2 },
      { id: 'difference', type: 'textarea', rows: 2 }
    ] },
    { time: 4, fields: [
      { id: 'traits', type: 'tags', min: 3, max: 5 },
      { id: 'notThis', type: 'textarea', rows: 2 },
      { id: 'tension', type: 'pair' }
    ] },
    { time: 4, fields: [
      { id: 'who', type: 'textarea', rows: 3 },
      { id: 'desire', type: 'textarea', rows: 2 }
    ] },
    { time: 5, fields: [
      { id: 'mood', type: 'tags', min: 5, max: 5 },
      { id: 'references', type: 'list', n: 3, min: 3 },
      { id: 'feeling', type: 'textarea', rows: 2 }
    ] },
    { time: 6, fields: [
      { id: 'voice', type: 'tags', min: 3, max: 3 },
      { id: 'message', type: 'textarea', rows: 2 },
      { id: 'visual', type: 'tags', min: 5, max: 5 },
      { id: 'signature', type: 'textarea', rows: 2 }
    ] },
    { time: 5, fields: [
      { id: 'always', type: 'list', n: 3, min: 3, bullet: true },
      { id: 'never', type: 'list', n: 3, min: 3, bullet: true },
      { id: 'priority', type: 'textarea', rows: 2 },
      { id: 'aiRule', type: 'fixed' }
    ] }
  ];

  const TEXT = {
    es: {
      pending: '[Pendiente]',
      exportTitle: 'BRANDBOOK OS 101',
      exportSub: 'El contexto mínimo que la IA necesita para entender, proteger y extender una marca.',
      sections: [
        { title: 'Esencia',
          desc: 'Qué es tu marca, la *idea* que la sostiene y por qué *importa*.',
          tip: 'Si no puedes decirlo *en una frase*, todavía no está claro. Todo lo demás se apoya en este bloque.',
          fields: {
            brand: { label: 'Marca', hint: '¿Qué es la marca, *qué hace* y *para quién* es?' },
            idea: { label: 'Idea', hint: '¿Cuál es *la única idea* por la que esta marca debería ser conocida?' },
            promise: { label: 'Promesa', hint: '¿Qué obtiene la gente de esta marca que *de verdad le importa*?' },
            difference: { label: 'Diferencia', hint: '¿Qué la hace *significativamente distinta* de lo que la gente esperaría normalmente?' }
          } },
        { title: 'Carácter',
          desc: 'La personalidad de tu marca y *lo que nunca sería*.',
          tip: 'La *tensión* es lo que hace memorable a una personalidad: dos cualidades que, en principio, no encajan.',
          fields: {
            traits: { label: 'Rasgos', hint: 'Elige *de 3 a 5 palabras* que describan la personalidad de la marca.' },
            notThis: { label: 'Esto no', hint: '¿Cómo no debería *sentirse*, *sonar* o *comportarse* nunca esta marca?' },
            tension: { label: 'Tensión', hint: '¿Qué dos cualidades crean su carácter? Ejemplo: *sofisticada + irreverente*.' }
          } },
        { title: 'Audiencia',
          desc: 'La *persona* a la que le habla tu marca y lo que *desea*.',
          tip: 'Hazlo *humano y específico*. Sin datos demográficos, salvo que de verdad importen a la marca.',
          fields: {
            who: { label: 'Quién', hint: '¿A *quién* le estamos hablando?' },
            desire: { label: 'Deseo', hint: '¿Qué *quiere*, *valora* o *le importa* a esta persona?' }
          } },
        { title: 'Mundo',
          desc: 'El *universo* al que pertenece tu marca y lo que *se siente* en él.',
          tip: 'Piensa en un *universo*, no en un moodboard: ¿qué películas, lugares o creadores viven en él?',
          fields: {
            mood: { label: 'Mood', hint: 'Elige *5 palabras* que describan el mundo de la marca.' },
            references: { label: 'Referencias', hint: 'Añade *3 referencias* visuales, culturales o creativas.' },
            feeling: { label: 'Sensación', hint: '¿Qué debería *sentir* alguien al encontrarse con esta marca?' }
          } },
        { title: 'Expresión',
          desc: 'Cómo *suena*, qué *dice* y cómo *se ve* tu marca.',
          tip: 'Elige palabras que *solo* podrían describir a tu marca. Si le sirven a cualquiera, no la distinguen.',
          fields: {
            voice: { label: 'Voz', prefix: 'Sonamos como:', hint: 'Sonamos como… *3 palabras*.' },
            message: { label: 'Mensaje', hint: '¿Qué debería *comunicar siempre* esta marca?' },
            visual: { label: 'Visual', prefix: 'Nos vemos como:', hint: 'Nos vemos como… *5 palabras*.' },
            signature: { label: 'Firma', hint: '¿Qué *elemento reconocible* podría hacer identificable a esta marca?' }
          } },
        { title: 'Reglas para la IA',
          desc: 'Los *límites* que protegen a tu marca cuando la IA duda.',
          tip: 'Cuanto más *concreta* la regla, mejor funciona. "Ser auténtica" no es una regla; "mostrar producto real, nunca idealizado" sí.',

  const STORAGE_KEY = 'ai-brand-os-v1';
  const LANG_KEY = 'brandbook-os-lang';

  /* ---------- Helpers ---------- */
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const plain = s => String(s ?? '').replace(/\*/g, '');
  const rich = s => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const clean = a => (Array.isArray(a) ? a : []).map(x => (x || '').trim()).filter(Boolean);
  const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const line = i => `bmk-line" style="--i:${i}`;

  function initialLang() {
    const q = new URLSearchParams(location.search).get('lang');
    if (q === 'es' || q === 'en') return q;
    try { const s = localStorage.getItem(LANG_KEY); if (s === 'es' || s === 'en') return s; } catch (e) {}
    return /^en\b/i.test(navigator.language || '') ? 'en' : 'es';
  }

  function ruleText(r) {
    return [...r.intro, '', r.prioritize, ...r.list.map((x, i) => `${i + 1}. ${x}`), '', ...r.rules, '', ...r.goal].join('\n');
  }
  function ruleHTML(r) {
    return `<p style="margin:0 0 10px">${esc(r.intro.join(' '))}</p>` +
      `<p style="margin:0 0 4px"><em>${esc(r.prioritize)}</em></p><ol style="margin:0 0 10px">${r.list.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` +
      `<p style="margin:0 0 10px">${esc(r.rules.join(' '))}</p>` +
      `<p style="margin:0">${esc(r.goal[0])} <em>${esc(r.goal[1])}</em></p>`;
  }
  function buildSections() {
    return BASE.map((b, i) => {
      const t = T.sections[i];
      return { ...b, title: t.title, desc: t.desc, tip: t.tip, fields: b.fields.map(f => {
        const out = { ...f, ...t.fields[f.id] };
        if (f.type === 'fixed') { out.html = ruleHTML(T.rule); out.text = ruleText(T.rule); }
        return out;
      }) };
    });
  }

  /* ---------- State ---------- */
  const root = document.getElementById('bmk');
  const toastEl = document.getElementById('bmk-toast');
  let state = load();
  let view = { name: 'map' };
  let lang = initialLang();
  let T = TEXT[lang];
  let SECTIONS = buildSections();
  const findField = id => { for (const s of SECTIONS) for (const f of s.fields) if (f.id === id) return f; };

  function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { return {}; } }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    const el = root.querySelector('[data-saved]');
    if (el) {
      if (el.textContent !== T.ui.savedOk) { el.textContent = T.ui.savedOk; replay([el]); }
      el.classList.add('flash'); clearTimeout(save.t);
      save.t = setTimeout(() => { el.classList.remove('flash'); el.textContent = T.ui.saved; replay([el]); }, 1400);
    }
  }

  /* ---------- Progress ---------- */
  function isFilled(f) {
    const v = state[f.id];
    switch (f.type) {
      case 'text': case 'textarea': return !!(v || '').trim();
      case 'list': return clean(v).length >= (f.min || f.n);
      case 'tags': return clean(v).length >= (f.min || 1);
      case 'pair': return Array.isArray(v) && !!(v[0] || '').trim() && !!(v[1] || '').trim();
      default: return true;
    }
  }
  const countable = s => s.fields.filter(f => f.type !== 'fixed');
  function secProg(s) { const fs = countable(s); const done = fs.filter(isFilled).length; return { done, total: fs.length, pct: Math.round(done / fs.length * 100) }; }
  function overall() { let d = 0, t = 0; SECTIONS.forEach(s => { const p = secProg(s); d += p.done; t += p.total; }); return { done: d, total: t, pct: Math.round(d / t * 100) }; }
  function nextIndex() { return SECTIONS.findIndex(s => { const p = secProg(s); return p.done < p.total; }); }
  function status(i) { const p = secProg(SECTIONS[i]); return p.done === p.total ? 'done' : p.done > 0 ? 'partial' : 'todo'; }

  /* ---------- Views ---------- */
  function mount() {
    root.innerHTML = `<div class="bmk-wrap"><div class="bmk-util">${langSwitch()}</div><div class="bmk-stage"></div></div>`;
    document.documentElement.lang = lang;
    render();
    placeLangPill(false);
  }

  function render(keepTop) {
    const stage = root.querySelector('.bmk-stage');
    stage.className = 'bmk-stage';
    stage.innerHTML = view.name === 'map' ? mapView() : view.name === 'section' ? sectionView(view.i, keepTop) : resultView(keepTop);
    placePill(true);
    void stage.offsetWidth;
    stage.classList.add('is-shown');
  }

  /* Repite el reveal sobre elementos que acaban de cambiar */
  function replay(els) {
    Array.prototype.forEach.call(els, (el, j) => {
      if (!el) return;
      el.classList.remove('bmk-upd');
      el.style.setProperty('--j', j);
      void el.offsetWidth;
      el.classList.add('bmk-upd');
    });
  }

  /* Pill deslizante del stepper: parte de la posición del step anterior y se anima hasta el nuevo.
     Sin step anterior (primera vez, resize, carga de fuentes) se coloca sin transición. */
  let lastPill = null;
  function placePill(animate) {
    const bar = root.querySelector('.bmk-steps');
    if (!bar) { lastPill = null; return; }
    const pill = bar.querySelector('.bmk-steps-pill'), tab = bar.querySelector('[aria-selected="true"]');
    if (!tab) return;
    const to = { x: tab.offsetLeft, w: tab.offsetWidth };
    const set = p => { pill.style.transform = `translateX(${p.x}px)`; pill.style.width = `${p.w}px`; };
    pill.style.transition = 'none';
    set(animate && lastPill ? lastPill : to);
    void pill.offsetWidth;
    pill.style.transition = '';
    set(to);
    if (bar.scrollWidth > bar.clientWidth) {
      if (lastPill) bar.scrollLeft = lastPill.scroll || 0;
      bar.scrollTo({ left: to.x - (bar.clientWidth - to.w) / 2, behavior: animate && lastPill ? 'smooth' : 'auto' });
    }
    lastPill = { ...to, scroll: to.x - (bar.clientWidth - to.w) / 2 };
  }

  /* Selector de idioma: mismo "Tabs sliding" que el stepper */
  function langSwitch() {
    return `<div class="bmk-lang" role="tablist" aria-label="Idioma / Language"><span class="bmk-lang-pill" aria-hidden="true"></span>${['es', 'en'].map(l =>
      `<button class="bmk-pill" role="tab" data-act="lang" data-lang="${l}" aria-selected="${l === lang}">${l.toUpperCase()}</button>`).join('')}</div>`;
  }
  function placeLangPill(animate) {
    const bar = root.querySelector('.bmk-lang');
    if (!bar) return;
    const pill = bar.querySelector('.bmk-lang-pill'), tab = bar.querySelector('[aria-selected="true"]');
    if (!animate) pill.style.transition = 'none';
    pill.style.transform = `translateX(${tab.offsetLeft}px)`;
    pill.style.width = `${tab.offsetWidth}px`;
    if (!animate) { void pill.offsetWidth; pill.style.transition = ''; }
  }

  function mapView() {
    const o = overall(), nx = nextIndex();
    const cta = o.done === 0 ? { t: T.ui.start, a: 'data-act="open" data-i="0"' }
      : nx === -1 ? { t: T.ui.seeResult + ' →', a: 'data-act="result"' }
      : { t: T.ui.cont(pad(nx + 1)), a: `data-act="open" data-i="${nx}"` };

    const rail = SECTIONS.map((s, i) => {
      const st = status(i);
      return `<button class="bmk-rail-step is-${st} ${i === nx ? 'is-next' : ''} ${line(3 + i)}" data-act="open" data-i="${i}" aria-label="${pad(i + 1)} ${esc(plain(s.title))}">
        <span class="bmk-node">${st === 'done' ? '✓' : pad(i + 1)}</span><span class="bmk-rail-label">${rich(s.title)}</span></button>`;
    }).join('') + `<button class="bmk-rail-step is-final ${line(3 + SECTIONS.length)}" data-act="result" aria-label="${esc(T.ui.result)}"><span class="bmk-node">✦</span><span class="bmk-rail-label"><em>Brandbook OS</em></span></button>`;

    return `
      <header class="bmk-hero">
        <h1><span class="${line(0)};display:block">Brandbook OS</span> <em class="${line(1)}">101</em></h1>
        <div class="bmk-panel ${line(2)}">
          <div class="bmk-panel-top"><span class="bmk-eyebrow">${esc(T.ui.progress)}</span><span class="bmk-pct">${o.pct}%</span></div>
          <div class="bmk-bar ${o.pct === 100 ? 'is-done' : ''}"><i style="width:${o.pct}%"></i></div>
          <button class="bmk-btn" ${cta.a}>${esc(cta.t)}</button>
        </div>
      </header>
      <nav class="bmk-rail" aria-label="${esc(T.ui.roadmap)}">${rail}</nav>
      <section class="bmk-how">${rows(T.ui.how, 13)}</section>`;
  }

  function rows(items, from) {
    return items.map((r, j) => `<div class="bmk-row ${line(from + j)}"><em>${esc(r.k)}</em><p>${esc(r.p)}<small>${esc(r.s)}</small></p></div>`).join('');
  }

  function stepper(current) {
    return `<div class="bmk-steps" role="tablist" aria-label="${esc(T.ui.blocks)}"><span class="bmk-steps-pill" aria-hidden="true"></span>${SECTIONS.map((s, i) => {
      const st = status(i), sel = i === current;
      return `<button class="bmk-pill ${st === 'done' ? 'is-done' : ''}" role="tab" aria-selected="${sel}" data-pill="${i}" data-act="open" data-i="${i}" title="${esc(plain(s.title))}">${st === 'done' && !sel ? '✓ ' : ''}${pad(i + 1)}</button>`;
    }).join('')}<button class="bmk-pill" role="tab" aria-selected="${current === 'result'}" data-act="result" title="Brandbook OS">✦ <em>OS</em></button></div>`;
  }

  function topBar(current, keepTop) {
    return `<div class="bmk-top ${keepTop ? '' : line(0)}">
      <button class="bmk-btn bmk-btn--ghost" data-act="map">${esc(T.ui.backMap)}</button>
      ${stepper(current)}
      <span class="bmk-saved" data-saved>${esc(T.ui.saved)}</span>
    </div>`;
  }

  function sectionView(i, keepTop) {
    const s = SECTIONS[i], p = secProg(s), last = i === SECTIONS.length - 1;
    return `${topBar(i, keepTop)}
      <div class="bmk-layout">
        <aside class="bmk-aside">
          <div class="bmk-sec-num ${line(1)}">${pad(i + 1)}</div>
          <h2 class="${line(2)}">${esc(plain(s.title))}</h2>
          <p class="bmk-desc ${line(3)}">${esc(plain(s.desc))}</p>
          <div class="bmk-aside-prog ${line(4)}"><em>${esc(T.ui.completed)}</em><span data-sec-count style="display:inline-block">${p.done}/${p.total}</span></div>
          <div class="bmk-bar ${p.done === p.total ? 'is-done' : ''} ${line(4)}" data-sec-bar><i style="width:${p.pct}%"></i></div>
          ${s.tip ? `<div class="bmk-tip ${line(5)}"><b>${esc(T.ui.tip)}</b>${rich(s.tip)}</div>` : ''}
        </aside>
        <div>
          <div class="bmk-form">${s.fields.map((f, k) => fieldHTML(f, k)).join('')}</div>
          <div class="bmk-nav ${line(Math.min(s.fields.length + 2, 11))}">
            ${i > 0 ? `<button class="bmk-btn bmk-btn--ghost" data-act="open" data-i="${i - 1}">← ${pad(i)} ${esc(plain(SECTIONS[i - 1].title))}</button>` : `<button class="bmk-btn bmk-btn--ghost" data-act="map">${esc(T.ui.backMap)}</button>`}
            ${last ? `<button class="bmk-btn" data-act="result">${esc(T.ui.seeResult)} ✦</button>` : `<button class="bmk-btn" data-act="open" data-i="${i + 1}">${pad(i + 2)} ${esc(plain(SECTIONS[i + 1].title))} →</button>`}
          </div>
        </div>
      </div>`;
  }

  function fieldHTML(f, k) {
    const v = state[f.id], fixed = f.type === 'fixed';
    let c = '';
    switch (f.type) {
      case 'text':
        c = `<input class="bmk-input" data-f="${f.id}" data-t="text" value="${esc(v)}" aria-label="${esc(f.label)}">`; break;
      case 'textarea':
        c = `<textarea class="bmk-input" rows="${f.rows || 2}" data-f="${f.id}" data-t="text" aria-label="${esc(f.label)}">${esc(v)}</textarea>`; break;
      case 'list': {
        const a = Array.isArray(v) ? v : [];
        let rowsHTML = '';
        for (let n = 0; n < f.n; n++) {
          rowsHTML += `<div class="bmk-list-row"><span class="bmk-list-n">${f.bullet ? '—' : n + 1}</span>
            <input class="bmk-input" data-f="${f.id}" data-t="list" data-k="${n}" value="${esc(a[n])}" aria-label="${esc(f.label)} ${n + 1}"><span></span></div>`;
        }
        c = `<div class="bmk-list">${rowsHTML}</div>`;
        break;
      }
      case 'tags': {
        const a = clean(v), range = f.min === f.max ? f.max : `${f.min}–${f.max}`;
        c = `<div class="bmk-tags">${a.map((t, n) => `<span class="bmk-tag">${esc(t)}<button class="bmk-x" data-act="rmtag" data-f="${f.id}" data-k="${n}" aria-label="${esc(T.ui.remove)} ${esc(t)}">×</button></span>`).join('')}
          ${a.length < f.max ? `<input class="bmk-tag-input" data-f="${f.id}" data-t="taginput" aria-label="${esc(f.label)}">` : ''}</div>
          <div class="bmk-count">${T.ui.of(a.length, range)}${a.length >= f.max ? T.ui.max : T.ui.enter}</div>`;
        break;
      }
      case 'pair': {
        const a = Array.isArray(v) ? v : [];
        c = `<div class="bmk-pair">
          <input class="bmk-input" data-f="${f.id}" data-t="list" data-k="0" value="${esc(a[0])}" aria-label="${esc(f.label)} 1">
          <span>+</span>
          <input class="bmk-input" data-f="${f.id}" data-t="list" data-k="1" value="${esc(a[1])}" aria-label="${esc(f.label)} 2"></div>`;
        break;
      }
      case 'fixed':
        c = `<div class="bmk-fixed">${f.html}</div>`; break;
    }
    return `<div class="bmk-field ${fixed ? 'bmk-field--fixed' : ''} ${!fixed && isFilled(f) ? 'is-done' : ''} ${k === undefined ? '' : line(Math.min(k + 2, 10))}" data-field="${f.id}">
      <div class="bmk-field-head"><span class="bmk-check">${fixed ? '•' : '✓'}</span><span class="bmk-label">${esc(f.label)}</span></div>
      <div class="bmk-field-body">${f.hint ? `<p class="bmk-hint">${rich(f.hint)}</p>` : ''}<div class="bmk-control">${c}</div></div></div>`;
  }

  function resultView(keepTop) {
    const o = overall();
    const missing = SECTIONS.map((s, i) => ({ i, s, fs: countable(s).filter(f => !isFilled(f)) })).filter(m => m.fs.length);
    return `${topBar('result', keepTop)}
      <div class="bmk-result-head">
        <div>
          <div class="bmk-eyebrow ${line(1)}">${pad(SECTIONS.length + 1)} · ${esc(T.ui.result)}</div>
          <h2 class="${line(2)}">${T.ui.resultTitle}</h2>
          <p class="${line(3)}">${esc(T.ui.resultSub)}</p>
        </div>
        <div class="bmk-actions ${line(4)}">
          <button class="bmk-btn" data-act="copy">${esc(T.ui.copy)}</button>
          <button class="bmk-btn bmk-btn--ghost" data-act="download">${esc(T.ui.download)}</button>
        </div>
      </div>
      ${missing.length ? `<div class="bmk-missing ${line(5)}"><h4>${esc(T.ui.missing(o.total - o.done, o.pct))}</h4><ul>${missing.map(m =>
        `<li><button data-act="open" data-i="${m.i}">${pad(m.i + 1)} ${esc(plain(m.s.title))}</button><span>${esc(m.fs.map(f => f.label).join(', '))}</span></li>`).join('')}</ul></div>`
        : `<div class="bmk-complete ${line(5)}">${T.ui.complete}</div>`}
      <pre class="bmk-pre ${line(6)}">${esc(buildText())}</pre>
      <section class="bmk-use">${rows(T.ui.use, 7)}</section>
      <div class="bmk-nav ${line(10)};margin-top:36px">
        <button class="bmk-btn bmk-btn--ghost" data-act="map">${esc(T.ui.backMapLong)}</button>
        <button class="bmk-link" data-act="reset">${esc(T.ui.reset)}</button>
      </div>`;
  }

  /* ---------- Export ---------- */
  function fmt(f) {
    const v = state[f.id];
    switch (f.type) {
      case 'text': case 'textarea': return (v || '').trim() || T.pending;
      case 'list': { const a = clean(v); return a.length ? a.map((x, k) => f.bullet ? `* ${x}` : `${k + 1}. ${x}`).join('\n') : T.pending; }
      case 'tags': { const a = clean(v); return a.length ? (f.prefix ? f.prefix + ' ' : '') + a.join(' · ') : T.pending; }
      case 'pair': { const a = Array.isArray(v) ? v : []; return (a[0] || '').trim() && (a[1] || '').trim() ? `${a[0].trim()} + ${a[1].trim()}` : T.pending; }
      case 'fixed': return f.text;
    }
  }

  function buildText() {
    const out = [T.exportTitle, T.exportSub, ''];
    SECTIONS.forEach((s, i) => {
      out.push('────────────────────────', `${pad(i + 1)} — ${plain(s.title).toUpperCase()}`, '');
      s.fields.forEach(f => out.push(f.label.toUpperCase(), fmt(f), ''));
    });
    return out.join('\n').trim();
  }

  /* ---------- UI helpers ---------- */
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 1800); }

  /* Cambio de contenido: fundido de salida (200ms) → render → entrada escalonada.
     keepTop: entre steps la barra superior se queda y la pill ya se ha deslizado. */
  let busy = false;
  function swap(update, keepTop) {
    const stage = root.querySelector('.bmk-stage');
    const done = () => {
      update(); render(keepTop); busy = false;
      if (root.getBoundingClientRect().top < 0) root.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
    };
    if (reduceMotion()) return done();
    busy = true;
    stage.classList.remove('is-shown');
    stage.classList.add('is-hiding');
    if (!keepTop) stage.classList.add('hide-all');
    setTimeout(done, 200);
  }
  function go(v) {
    if (busy || (v.name === view.name && v.i === view.i)) return;
    const keepTop = view.name !== 'map' && v.name !== 'map';
    if (keepTop) {
      root.querySelectorAll('.bmk-steps .bmk-pill').forEach(b =>
        b.setAttribute('aria-selected', String(v.name === 'section' ? b.dataset.pill === String(v.i) : !b.dataset.pill)));
      placePill(true);
    }
    swap(() => { view = v; }, keepTop);
  }
  function setLang(l) {
    if (busy || l === lang) return;
    root.querySelectorAll('.bmk-lang .bmk-pill').forEach(b => b.setAttribute('aria-selected', String(b.dataset.lang === l)));
    placeLangPill(true);
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    swap(() => { lang = l; T = TEXT[l]; SECTIONS = buildSections(); document.documentElement.lang = l; }, false);
  }

  const headOf = el => el.querySelectorAll('.bmk-check, .bmk-label');
  function rerenderField(id, focusType, animate) {
    const el = root.querySelector(`[data-field="${id}"]`);
    if (!el) return;
    const was = el.classList.contains('is-done');
    const tmp = document.createElement('div');
    tmp.innerHTML = fieldHTML(findField(id));
    const nu = tmp.firstElementChild;
    el.replaceWith(nu);
    if (nu.classList.contains('is-done') !== was) replay(headOf(nu));
    if (animate) replay(animate(nu));
    if (focusType) { const inputs = nu.querySelectorAll(`[data-t="${focusType}"]`); inputs.length && inputs[inputs.length - 1].focus(); }
  }
  function refresh() {
    if (view.name !== 'section') return;
    const s = SECTIONS[view.i], p = secProg(s);
    s.fields.forEach(f => {
      if (f.type === 'fixed') return;
      const el = root.querySelector(`[data-field="${f.id}"]`), d = isFilled(f);
      if (el && el.classList.contains('is-done') !== d) { el.classList.toggle('is-done', d); replay(headOf(el)); }
    });
    const cnt = root.querySelector('[data-sec-count]'), txt = `${p.done}/${p.total}`;
    if (cnt && cnt.textContent !== txt) { cnt.textContent = txt; replay([cnt]); }
    const bar = root.querySelector('[data-sec-bar]'); if (bar) { bar.firstElementChild.style.width = p.pct + '%'; bar.classList.toggle('is-done', p.done === p.total); }
    root.querySelectorAll('[data-pill]').forEach(b => {
      const i = +b.dataset.pill, done = status(i) === 'done', was = b.classList.contains('is-done');
      b.classList.toggle('is-done', done);
      if (i !== view.i) b.textContent = (done ? '✓ ' : '') + pad(i + 1);
      if (was !== done) replay([b]);
    });
    placePill(false);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove(); return ok;
    }
  }
  function commitTag(t, refocus) {
    const id = t.dataset.f, f = findField(id);
    const val = t.value.replace(/,+$/, '').trim();
    if (!val) return;
    const a = clean(state[id]);
    if (a.length >= f.max) return;
    if (!a.some(x => x.toLowerCase() === val.toLowerCase())) a.push(val);
    state[id] = a; save();
    rerenderField(id, refocus ? 'taginput' : null, nu => [[...nu.querySelectorAll('.bmk-tag')].pop(), nu.querySelector('.bmk-count')]);
    refresh();
  }

  /* ---------- Events ---------- */
  root.addEventListener('input', e => {
    const t = e.target, id = t.dataset.f, ty = t.dataset.t;
    if (!id) return;
    if (ty === 'text') state[id] = t.value;
    else if (ty === 'list') { const a = Array.isArray(state[id]) ? state[id] : []; a[+t.dataset.k] = t.value; state[id] = a; }
    else return;
    save(); refresh();
  });

  root.addEventListener('keydown', e => {
    const t = e.target;
    if (!t.dataset || t.dataset.t !== 'taginput') return;
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commitTag(t, true); }
    else if (e.key === 'Backspace' && !t.value) {
      const a = clean(state[t.dataset.f]); if (a.length) { a.pop(); state[t.dataset.f] = a; save(); rerenderField(t.dataset.f, 'taginput'); refresh(); }
    }
  });

  root.addEventListener('focusout', e => {
    const t = e.target;
    if (t.dataset && t.dataset.t === 'taginput' && t.value.trim()) {
      const next = e.relatedTarget;
      // no re-renderizar si el foco va a un botón del mismo campo
      if (next && next.closest && next.closest(`[data-field="${t.dataset.f}"]`)) return;
      commitTag(t, false);
    }
  });

  root.addEventListener('click', async e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.dataset.f;
    switch (b.dataset.act) {
      case 'lang': setLang(b.dataset.lang); break;
      case 'open': go({ name: 'section', i: +b.dataset.i }); break;
      case 'map': go({ name: 'map' }); break;
      case 'result': go({ name: 'result' }); break;
      case 'rmtag': { const a = clean(state[id]); a.splice(+b.dataset.k, 1); state[id] = a; save(); rerenderField(id, 'taginput', nu => [nu.querySelector('.bmk-count')]); refresh(); break; }
      case 'copy': toast((await copyText(buildText())) ? T.ui.copied : T.ui.copyFail); break;
      case 'download': {
        const url = URL.createObjectURL(new Blob([buildText()], { type: 'text/markdown;charset=utf-8' }));
        const a = document.createElement('a'); a.href = url; a.download = `brandbook-os-101-${lang}.md`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
        break;
      }
      case 'reset':
        if (confirm(T.ui.confirmReset)) { state = {}; save(); view = { name: 'result' }; go({ name: 'map' }); toast(T.ui.cleared); }
        break;
    }
  });

  window.addEventListener('resize', () => { placePill(false); placeLangPill(false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placePill(false); placeLangPill(false); });

  mount();
})();
</script>
</body>
</html>
